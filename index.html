
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디스코드 도우미 | 공식 웹사이트</title>
  <meta name="description" content="디스코드 서버 제작 팁과 서버 템플릿을 제공하는 디스코드 도우미야.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f7f8fc;
      color: #232438;
    }
    header {
      background: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0000000a;
    }
    .logo { font-size: 22px; font-weight: bold; color: #5865f2; }
    nav a { margin-left: 18px; color: #555; text-decoration: none; }
    .hero {
      text-align: center;
      padding: 90px 20px;
      background: linear-gradient(135deg, #e9eaff, #f8eaff);
    }
    .hero h1 { font-size: clamp(32px, 6vw, 54px); margin: 0 0 18px; }
    .hero p { font-size: 18px; line-height: 1.8; color: #55566b; }
    .button {
      display: inline-block;
      background: #5865f2;
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      margin-top: 18px;
    }
    section { padding: 55px 8%; text-align: center; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 28px;
    }
    .card {
      background: white;
      padding: 28px 20px;
      border-radius: 16px;
      box-shadow: 0 5px 22px #25254a0b;
    }
    .card p { color: #68697a; line-height: 1.7; }
    footer { padding: 25px; text-align: center; color: #777; }
  </style>
</head>
<body>
  <header>
    <div class="logo">💜 디스코드 도우미</div>
    <nav><a href="#about">소개</a><a href="#resources">자료</a></nav>
  </header>

  <main>
    <div class="hero">
      <h1>디스코드를 더 쉽게!</h1>
      <p>서버 제작부터 관리까지<br>필요한 정보를 한곳에서 만나 봐.</p>
      <a class="button" href="#resources">자료 둘러보기 ↓</a>
    </div>

    <section id="about">
      <h2>디스코드 도우미는?</h2>
      <p>디스코드 서버를 처음 만드는 사람도 쉽게 배울 수 있도록 돕는 공간이야.</p>
    </section>

    <section id="resources">
      <h2>무엇을 찾고 있어?</h2>
      <div class="cards">
        <div class="card">
          <h3>📘 서버 제작 가이드</h3>
          <p>채널과 역할을 구성하고 서버를 관리하는 방법을 배워 봐.</p>
        </div>
        <div class="card">
          <h3>🧩 서버 템플릿</h3>
          <p>서버를 구성할 때 참고할 수 있는 템플릿 자료를 준비할 수 있어.</p>
        </div>
        <div class="card">
          <h3>🤖 봇 활용 팁</h3>
          <p>디스코드 봇과 자동화 기능을 알아보자.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>© 2026 디스코드 도우미</footer>
</body>
</html>
